<!doctype html>
<html lang="vi" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gửi bố — 20/11</title>
  <meta name="description" content="Có một bất ngờ nhỏ dành cho người thầy đặc biệt nhất.">
  <!-- A private family page: ask search engines not to index it. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF7F2">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gửi bố nhân ngày 20/11">
  <meta property="og:description" content="Có một bất ngờ nhỏ dành cho người thầy đặc biệt nhất.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <script>
    // Mark that JavaScript is available (enables the envelope intro + animations).
    (function (d) {
      d.documentElement.className = d.documentElement.className.replace('no-js', 'js');
      // Safety net: if main.js never starts, fall back to a plain readable page.
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__giftReady) d.documentElement.classList.remove('js');
        }, 2000);
      });
    })(document);
  </script>
  <script src="js/data.js" defer></script>
  <script src="js/gallery.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <noscript>
    <p class="noscript">Trang này cần bật JavaScript để mở lá thư.</p>
  </noscript>

  <!-- ═════════════════════════════════════════════════════════════════════
       SECTION 1 — THE ENVELOPE
       ═════════════════════════════════════════════════════════════════════ -->
  <div class="intro" id="intro">
    <div class="intro__stage">
      <button class="envelope" id="envelope" type="button" aria-describedby="intro-tagline">
        <span class="sr-only" data-text="envelope.openLabel"></span>
        <span class="envelope__back" aria-hidden="true"></span>
        <span class="envelope__letter" aria-hidden="true">
          <span class="envelope__peek" data-text="envelope.peek"></span>
          <span class="envelope__lines"><span></span><span></span><span></span><span></span></span>
          <span class="envelope__mark">20 · 11</span>
        </span>
        <span class="envelope__pocket" aria-hidden="true"></span>
        <span class="envelope__bottom" aria-hidden="true"></span>
        <span class="envelope__flap" aria-hidden="true"></span>
        <span class="envelope__seal" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </span>
        <span class="envelope__address">
          <span class="envelope__to" data-text="envelope.to"></span>
          <span class="envelope__occasion" data-text="envelope.occasion"></span>
        </span>
      </button>

      <div class="intro__caption">
        <p class="intro__tagline" id="intro-tagline" data-text="envelope.tagline"></p>
        <p class="intro__hint" aria-hidden="true"><span data-text="envelope.hint"></span></p>
      </div>
    </div>
  </div>

  <main class="story" id="main">

    <!-- ═══════════════════════════════════════════════════════════════════
         SECTION 2 — A MESSAGE FOR DAD
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="message" id="loi-gui" aria-labelledby="message-quote">
      <div class="message__inner">
        <p class="eyebrow" data-enter style="--d: 150" data-text="message.eyebrow"></p>
        <span class="message__mark" data-enter style="--d: 300" aria-hidden="true">“</span>
        <h1 class="message__quote" id="message-quote" tabindex="-1"></h1>
        <span class="ornament" data-enter style="--d: 1500" aria-hidden="true">
          <svg viewBox="0 0 120 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 6h47M73 6h47"/><path d="M60 1.5 64.5 6 60 10.5 55.5 6z" fill="currentColor" stroke="none"/><circle cx="51" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="69" cy="6" r="1.3" fill="currentColor" stroke="none"/></svg>
        </span>
        <p class="message__intro" data-enter style="--d: 1750" data-text="message.intro"></p>
      </div>
      <a class="scroll-cue" id="scroll-cue" href="#bon-dieu" data-enter style="--d: 2300">
        <span data-text="message.scrollHint"></span>
        <span class="scroll-cue__line" aria-hidden="true"></span>
      </a>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECTION 3 — FOUR FLIP CARDS
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="section" id="bon-dieu" aria-labelledby="cards-title">
      <header class="section-head" data-reveal>
        <p class="section-head__chapter" aria-hidden="true" data-text="cards.chapter"></p>
        <p class="eyebrow" data-text="cards.eyebrow"></p>
        <h2 class="section-head__title" id="cards-title" data-text="cards.title"></h2>
        <p class="section-head__lead" data-text="cards.lead"></p>
      </header>
      <ul class="cards" id="cards" role="list" data-reveal></ul>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECTION 4 — FAMILY MEMORY GALLERY
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="section gallery" id="ky-niem" aria-labelledby="gallery-title">
      <header class="section-head" data-reveal>
        <p class="section-head__chapter" aria-hidden="true" data-text="gallery.chapter"></p>
        <p class="eyebrow" data-text="gallery.eyebrow"></p>
        <h2 class="section-head__title" id="gallery-title" data-text="gallery.title"></h2>
        <p class="section-head__lead" data-text="gallery.lead"></p>
      </header>

      <ul class="polaroids" id="polaroids" role="list" data-reveal hidden></ul>

      <div class="gallery-empty" id="gallery-empty" data-reveal hidden>
        <div class="gallery-empty__frames" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="gallery-empty__title" data-text="gallery.emptyTitle"></p>
        <p class="gallery-empty__text" data-text="gallery.emptyText"></p>
        <button type="button" class="btn btn--ghost gallery-empty__add" id="gallery-empty-add" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
          Thêm ảnh
        </button>
      </div>

      <!-- Optional: photos added from this browser (stored in IndexedDB on this device only) -->
      <details class="album-tools" id="album-tools" hidden>
        <summary class="album-tools__summary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
          <span>Thêm ảnh vào album</span>
        </summary>

        <div class="album-tools__panel">
          <form class="album-form" id="album-form" novalidate>
            <div class="album-form__file">
              <input type="file" id="photo-input" class="sr-only" accept="image/*" multiple>
              <label for="photo-input" class="btn btn--ghost">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                Chọn ảnh
              </label>
              <span class="album-form__chosen" id="photo-chosen">Chưa chọn ảnh nào</span>
            </div>

            <label class="field">
              <span class="field__label">Chú thích <em>(không bắt buộc)</em></span>
              <input type="text" id="photo-caption" maxlength="140" autocomplete="off" placeholder="Một dòng ngắn về tấm ảnh">
            </label>
            <label class="field">
              <span class="field__label">Thời gian <em>(không bắt buộc)</em></span>
              <input type="text" id="photo-date" maxlength="40" autocomplete="off" placeholder="Ví dụ: Hè 2015">
            </label>

            <button type="submit" class="btn btn--solid" id="photo-save" disabled>Lưu vào album</button>
          </form>

          <p class="album-tools__note">
            Ảnh thêm ở đây chỉ được lưu trong trình duyệt của thiết bị này và không tự chuyển sang máy khác.
            Dùng <strong>Sao lưu</strong> để giữ lại hoặc mang ảnh sang thiết bị khác.
          </p>

          <div class="album-tools__row">
            <button type="button" class="btn btn--text" id="album-export">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Sao lưu (.json)
            </button>
            <button type="button" class="btn btn--text" id="album-import-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
              Khôi phục từ bản sao lưu
            </button>
            <input type="file" id="album-import" class="sr-only" accept="application/json,.json" tabindex="-1" aria-hidden="true">
            <button type="button" class="btn btn--text btn--danger" id="album-clear">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
              Xoá ảnh đã thêm
            </button>
          </div>

          <p class="album-tools__status" id="album-status" role="status" aria-live="polite"></p>
        </div>
      </details>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECTION 5 — THE MAIN LETTER
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="section letter-section" id="la-thu" aria-labelledby="letter-title">
      <header class="section-head" data-reveal>
        <p class="section-head__chapter" aria-hidden="true" data-text="letter.chapter"></p>
        <p class="eyebrow" data-text="letter.eyebrow"></p>
        <h2 class="section-head__title" id="letter-title" data-text="letter.title"></h2>
      </header>

      <div class="letter-wrap" id="letter-wrap">
        <article class="letter" aria-label="Lá thư con gửi bố">
          <p class="letter__date" data-line data-text="letter.dateLine"></p>
          <p class="letter__salutation" data-line data-text="letter.salutation"></p>
          <div class="letter__body" id="letter-body"></div>
          <p class="letter__signature" id="letter-signature" data-line></p>
        </article>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECTION 6 — THE FINAL HUG
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="hug" id="om-bo" aria-labelledby="hug-big">
      <div class="hug__glow" aria-hidden="true"></div>
      <div class="hug__inner" data-reveal>
        <p class="hug__lead" data-text="hug.lead"></p>
        <h2 class="hug__big" id="hug-big" data-text="hug.big"></h2>
        <button type="button" class="hug__btn" id="hug-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span id="hug-btn-label" data-text="hug.button"></span>
        </button>
        <p class="hug__message" id="hug-message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p data-text="footer.text"></p>
  </footer>

  <!-- Background music toggle (shown only if assets/audio/piano.mp3 exists) -->
  <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false" aria-label="Bật nhạc nền" title="Bật nhạc nền" hidden>
    <svg class="music-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span class="music-toggle__bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
  </button>

  <!-- Photo lightbox -->
  <dialog class="lightbox" id="lightbox" aria-label="Xem ảnh kỷ niệm">
    <div class="lightbox__bar">
      <p class="lightbox__counter" id="lightbox-counter" aria-live="polite"></p>
      <button class="icon-btn" id="lightbox-close" type="button" aria-label="Đóng ảnh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="lightbox__stage" id="lightbox-stage">
      <button class="icon-btn lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="Ảnh trước">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" id="lightbox-img" alt="">
        <figcaption class="lightbox__caption" id="lightbox-figcaption">
          <span class="lightbox__text" id="lightbox-caption"></span>
          <span class="lightbox__date" id="lightbox-date"></span>
        </figcaption>
      </figure>
      <button class="icon-btn lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="Ảnh tiếp theo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div class="lightbox__foot" id="lightbox-local" hidden>
      <span>Ảnh này được lưu trên trình duyệt của thiết bị này.</span>
      <button class="btn btn--text btn--on-dark" id="lightbox-delete" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        Xoá ảnh này
      </button>
    </div>
  </dialog>

  <div class="hearts-layer" id="hearts-layer" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
